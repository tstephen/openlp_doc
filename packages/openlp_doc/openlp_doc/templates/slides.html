<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }}</title>
    <style>
      body {
        font-family: Helvetica,Roboto,Ubuntu,Calibri,Arial,sans-serif;
      }
      section.item-header {
        font-size: 1.2rem;
      }
      section.item-body {
        font-size: 1.2rem;
      }
      footer.item-footer {
        font-size: 0.8rem;
      }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/reveal.js@5.2.1/dist/reset.css">
    <link rel="stylesheet" href="https://unpkg.com/reveal.js@5.2.1/dist/reveal.css">
    <link rel="stylesheet" href="https://unpkg.com/reveal.js@5.2.1/dist/theme/black.css">
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        {% for song in songs %}
          <section class="song">
            {{ song }}
          </section>
        {% endfor %}
      </div>
    </div>

    <script src="https://unpkg.com/reveal.js@5.2.1/dist/reveal.js"></script>
    <script src="https://unpkg.com/reveal.js@5.2.1/plugin/notes/notes.js"></script>
    <script src="https://unpkg.com/reveal.js@5.2.1/plugin/markdown/markdown.js"></script>
    <script src="https://unpkg.com/reveal.js@5.2.1/plugin/highlight/highlight.js"></script>
    <script>
      // More info about initialization & config:
      // - https://revealjs.com/initialization/
      // - https://revealjs.com/config/
      Reveal.initialize({
              hash: true,

              // Learn about plugins: https://revealjs.com/plugins/
              plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
      });
    </script>
    <script src="/openlp_ctrl/js/client.js"></script>
  </body>
</html>
