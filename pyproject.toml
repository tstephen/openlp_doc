[tool.poetry]
name = "openlp-monorepo"
version = "0.1.0"
description = "Monorepo for OpenLP helper applications"
authors = ["Tim Stephenson <tim@knowprocess.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
openlp-ctrl = {path = "packages/openlp_ctrl", develop = true}
openlp-doc = {path = "packages/openlp_doc", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
coverage = "^7.4.1"
pre-commit = "^4.3.0"
httpx = "^0.25.0"

[tool.poetry.requires-plugins]
poetry-docker-plugin = ">=0.6.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
