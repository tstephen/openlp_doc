name: OpenLP Monorepo CI

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/openlp-monorepo-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/openlp-monorepo-ci.yml'
  workflow_dispatch:

jobs:
  discover-packages:
    name: Discover Poetry packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Find package directories
        id: packages
        shell: bash
        run: |
          packages=$(find packages -mindepth 2 -maxdepth 2 -name pyproject.toml -printf '%h\n' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.package }}
    needs: discover-packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover-packages.outputs.packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: poetry

      - name: Install Poetry
        run: pipx install 'poetry>=2.0,<3.0'

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest tests -v

  build:
    name: Build ${{ matrix.package }}
    needs: [discover-packages, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover-packages.outputs.packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: poetry

      - name: Install Poetry
        run: pipx install 'poetry>=2.0,<3.0'

      - name: Build package
        run: poetry build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ hashFiles(format('{0}/pyproject.toml', matrix.package)) }}
          path: ${{ matrix.package }}/dist/*
