name: OpenLP Ctrl CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'packages/openlp_ctrl/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/openlp-ctrl-ci.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - 'packages/openlp_ctrl/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/openlp-ctrl-ci.yml'
  workflow_dispatch:
  schedule:
    # Weekly check-in; the gate deploys only on the last Saturday of the month.
    - cron: '0 3 * * 6'

env:
  KUBE_CLUSTER: kp-lon1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/openlp-ctrl

jobs:
  schedule_gate:
    name: Decide deployment eligibility
    runs-on: ubuntu-latest
    outputs:
      run_deploy: ${{ steps.last-saturday.outputs.run_deploy }}
    steps:
      - name: Decide whether this run should deploy
        id: last-saturday
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "run_deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$(date -u -d '+7 days' +%m)" != "$(date -u +%m)" ]; then
            echo "run_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: packages/openlp_ctrl

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          pipx install poetry>=2.0

      - name: Cache Poetry dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry install --with dev

      - name: Run tests
        run: |
          poetry run test

      - name: Generate coverage report
        run: |
          poetry run coverage report > coverage.txt
          poetry run coverage report --format=markdown > coverage.md

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const coverageMarkdown = fs.readFileSync('packages/openlp_ctrl/coverage.md', 'utf8');
            const coverageText = fs.readFileSync('packages/openlp_ctrl/coverage.txt', 'utf8');

            const body = `## Coverage Report\n\n\`\`\`\n${coverageText}\n\`\`\`\n\n${coverageMarkdown}`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## Coverage Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  build-and-push-docker:
    name: Build and Push Docker Image
    needs: [test, schedule_gate]
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.sha-tag.outputs.sha_tag }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read package version
        id: package-version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/openlp_ctrl/pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' || needs.schedule_gate.outputs.run_deploy == 'true' }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=v${{ steps.package-version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: packages/openlp_ctrl
          file: packages/openlp_ctrl/Dockerfile
          push: ${{ github.event_name == 'push' || needs.schedule_gate.outputs.run_deploy == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract SHA tag for deployment
        id: sha-tag
        run: |
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Kubernetes
    needs: [build-and-push-docker, schedule_gate]
    runs-on: ubuntu-latest
    if: ${{ needs.schedule_gate.outputs.run_deploy == 'true' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: |
          doctl kubernetes cluster kubeconfig save ${{ env.KUBE_CLUSTER }}

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'latest'

      - name: Deploy to Kubernetes
        run: |
          helm upgrade openlp-ctrl ./packages/openlp_ctrl/helm/openlp_ctrl \
            --install \
            --create-namespace \
            --namespace cbc \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-and-push-docker.outputs.sha_tag }} \
            --wait \
            --timeout 5m
